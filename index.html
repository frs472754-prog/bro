<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Red Bull Supremacy</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100vh;
    background-color: #05070a; overflow: hidden;
    font-family: 'Courier Prime', monospace;
    position: fixed; top: 0; left: 0; cursor: none;
  }

  /* --- КУРСОР --- */
  .cursor-glow {
    position: fixed; top: 0; left: 0;
    width: 20px; height: 20px;
    border: 1px solid #ffd700; border-radius: 50%;
    pointer-events: none; z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width .25s ease, height .25s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
    box-shadow: 0 0 15px #ffd700, inset 0 0 10px #ffd700;
    mix-blend-mode: screen; will-change: left, top;
  }
  .cursor-glow.hover {
    width: 44px; height: 44px;
    background: rgba(255,215,0,.15); border-color: #fff;
    box-shadow: 0 0 25px #ffd700, inset 0 0 18px #ffd700;
  }

  /* --- ГЛАВНОЕ МЕНЮ --- */
  .bg-main {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
    background: radial-gradient(circle at 30% 20%, rgba(255,215,0,.05) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(255,215,0,.03) 0%, transparent 40%),
                linear-gradient(180deg, #05070a 0%, #0a101a 50%, #05070a 100%);
  }

  .main-window {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 90%; max-width: 380px;
    background: rgba(10, 15, 25, 0.6);
    border: 1px solid rgba(255, 215, 0, 0.2); border-top: 3px solid #ffd700;
    border-radius: 12px; padding: 40px 25px 30px; z-index: 10;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.05);
    color: #fff; text-align: center;
    animation: windowBreath 7s ease-in-out infinite;
    transition: opacity .6s ease, transform .6s ease; will-change: transform;
  }
  @keyframes windowBreath {
    0%, 100% { transform: translate(-50%,-50%) translateY(0); }
    50% { transform: translate(-50%,-50%) translateY(-6px); }
  }

  .main-window h1 {
    margin: 0; font-size: 26px; letter-spacing: 3px; color: #fff;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.9), 0 0 30px rgba(255,215,0,.5);
    font-weight: 700; font-family: 'Oswald', sans-serif; text-transform: uppercase;
    animation: textPulse 3s ease-in-out infinite alternate;
    line-height: 1.2;
  }
  @keyframes textPulse {
    0% { text-shadow: 0 0 10px rgba(255,215,0,0.6); }
    100% { text-shadow: 0 0 20px rgba(255,215,0,1); }
  }

  .subtitle-ru {
    font-size: 12px; color: #ffd700; margin: 15px 0 35px; letter-spacing: 2px;
    opacity: .8; font-weight: 700; font-family: 'Courier Prime', monospace;
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(255,215,0,.05); color: #fff;
    border: 1px solid rgba(255,215,0,.3);
    padding: 16px 20px; font-family: 'Oswald', sans-serif;
    font-size: 15px; font-weight: 700; text-transform: uppercase;
    cursor: none; position: relative; overflow: hidden;
    border-radius: 6px; letter-spacing: 2px;
    transition: all .4s cubic-bezier(.22,1,.36,1);
    width: 100%;
  }
  .btn:hover { background: rgba(255,215,0,.15); border-color: #ffd700; box-shadow: 0 0 30px rgba(255,215,0,.5); }

  /* =========================================================
     АРЕНА (ДУЭЛИ 1 НА 1)
     ========================================================= */
  .arena-modal {
    display: none; position: fixed; inset: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, #111822 0%, #030508 100%);
    z-index: 200; overflow: hidden;
    opacity: 0; transition: opacity 0.6s ease;
  }
  .arena-modal.show { display: block; opacity: 1; }

  .scanline {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.5) 51%);
    background-size: 100% 4px; opacity: 0.15;
  }

  .arena-title {
    position: absolute; top: 5%; width: 100%; text-align: center;
    font-family: 'Oswald', sans-serif; font-size: 28px; color: #ffd700;
    letter-spacing: 6px; text-shadow: 0 0 30px #ffd700;
    opacity: 0; transition: opacity 0.5s ease; z-index: 10;
  }

  /* Общий стиль для банок */
  .fighter-rb, .fighter-enemy {
    position: absolute; top: 50%; transform: translateY(-50%);
    z-index: 20; display: flex; align-items: center; justify-content: center;
    transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .fighter-rb img, .fighter-enemy img {
    width: 100%; height: 100%; object-fit: contain;
    mix-blend-mode: multiply; /* Убирает белый фон */
    filter: contrast(1.1) brightness(1.05);
  }

  .fighter-rb {
    left: 15%; width: 160px; height: 340px;
    filter: drop-shadow(0 0 30px rgba(255,215,0,0.4));
    opacity: 0;
  }
  .fighter-rb.show { opacity: 1; }
  .fighter-rb.center {
    left: 50%; transform: translate(-50%, -50%) scale(1.4);
    filter: drop-shadow(0 0 80px rgba(255,215,0,0.8)); z-index: 50;
  }

  .fighter-enemy {
    right: 15%; width: 160px; height: 340px; /* Одинаковый размер с RB */
    opacity: 0; transform: translate(200px, -50%);
  }
  .fighter-enemy.show { opacity: 1; transform: translate(0, -50%); }

  /* Анимация смерти как в Марио */
  .fighter-enemy.dead {
    animation: marioDeath 1.5s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  @keyframes marioDeath {
    0% { transform: translate(0, -50%) scale(1); opacity: 1; }
    20% { transform: translate(0, -80%) scale(1); opacity: 1; } /* Подпрыгивает */
    50% { transform: translate(50px, 50%) scale(0.8) rotate(180deg); opacity: 1; } /* Падает вниз и переворачивается */
    100% { transform: translate(100px, 200%) scale(0.5) rotate(360deg); opacity: 0; } /* Улетает */
  }

  /* Плашка сравнения (все показатели) */
  .clash-box {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.8);
    width: 90%; max-width: 420px; background: rgba(0,0,0,0.85); border: 1px solid rgba(255,215,0,0.3);
    border-radius: 12px; padding: 20px; text-align: center; z-index: 15;
    opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    backdrop-filter: blur(10px); box-shadow: 0 0 50px rgba(0,0,0,0.8);
  }
  .clash-box.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .clash-title {
    font-family: 'Oswald', sans-serif; color: #fff; font-size: 20px;
    letter-spacing: 3px; margin-bottom: 15px; text-shadow: 0 0 10px #fff;
    text-transform: uppercase;
  }

  .stat-row { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; }
  .stat-name { width: 70px; font-size: 10px; color: #aaa; text-align: right; font-family: 'Oswald'; text-transform: uppercase; }
  
  .stat-bar-bg { flex: 1; height: 14px; background: rgba(255,255,255,0.1); border-radius: 7px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.2); }
  .stat-bar-fill { height: 100%; width: 0%; transition: width 0.8s ease; position: absolute; top: 0; }
  
  .fill-rb { background: linear-gradient(90deg, #ff8c00, #ffd700); left: 0; }
  .fill-enemy { background: #666; right: 0; } /* Заполняется справа */

  /* Плашка MOGGED */
  .mogged-slam {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(3);
    background: #ff1a1a; color: #fff; border: 4px solid #fff;
    padding: 10px 30px; font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 32px; letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 0 0 50px #ff1a1a; opacity: 0; z-index: 99;
    text-shadow: 2px 2px 0 #000;
  }
  .mogged-slam.slam { animation: slamAnim 0.4s forwards; }
  @keyframes slamAnim {
    0% { transform: translate(-50%, -50%) scale(3) rotate(-20deg); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1) rotate(-10deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.1) rotate(-10deg); opacity: 1; }
  }

  /* --- ФИНАЛ (ДОСТИЖЕНИЯ) --- */
  .final-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 1s ease; backdrop-filter: blur(10px);
  }
  .final-overlay.show { opacity: 1; pointer-events: auto; }

  .achievements-box {
    background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
    border: 3px solid #ffd700; border-radius: 20px; padding: 40px 50px;
    text-align: center; box-shadow: 0 0 150px rgba(255,215,0,0.3);
    transform: scale(0.8); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative; overflow: hidden;
  }
  .final-overlay.show .achievements-box { transform: scale(1); }
  .achievements-title { font-family: 'Oswald', sans-serif; font-size: 36px; color: #ffd700; text-transform: uppercase; letter-spacing: 6px; margin-bottom: 25px; text-shadow: 0 0 30px #ffd700; font-weight: 700; }
  .ach-item { font-size: 16px; color: #fff; display: flex; align-items: center; gap: 15px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,215,0,0.2); opacity: 0; transform: translateX(-20px); transition: all 0.4s ease; text-align: left; }
  .final-overlay.show .ach-item { opacity: 1; transform: translateX(0); }
  .ach-item::before { content: '🏆'; font-size: 20px; filter: drop-shadow(0 0 10px #ffd700); }

  .close-btn {
    position: absolute; top: 20px; right: 20px; z-index: 999;
    background: transparent; color: #ffd700; border: 1px solid #ffd700;
    padding: 10px 20px; font-family: 'Oswald', sans-serif; font-size: 16px;
    cursor: pointer; border-radius: 4px; transition: 0.3s;
  }
  .close-btn:hover { background: #ffd700; color: #000; }

  @media (max-width: 900px) {
    .fighter-rb, .fighter-enemy { width: 100px; height: 220px; }
    .fighter-rb { left: 5%; }
    .fighter-enemy { right: 5%; }
    .clash-box { width: 95%; padding: 15px; }
    .achievements-box { padding: 30px; width: 95%; }
    .achievements-title { font-size: 24px; }
    .ach-item { font-size: 14px; }
  }
</style>
</head>
<body>

  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="bg-main"></div>

  <!-- ГЛАВНОЕ ОКНО -->
  <div class="main-window" id="mainWindow">
    <h1>ВЫ ДОЛЖНЫ<br>ЭТО ЗНАТЬ</h1>
    <p class="subtitle-ru">Сделано: zero.ping</p>

    <button id="btnStart" class="btn" type="button">ЗАПУСТИТЬ</button>
  </div>

  <!-- СЦЕНА -->
  <div class="arena-modal" id="arenaModal">
    <button class="close-btn" id="btnClose">[ X ] ЗАКРЫТЬ</button>
    <div class="scanline"></div>
    
    <div class="arena-title" id="arenaTitle">RED BULL УНИЧТОЖАЕТ</div>

    <!-- RED BULL (Ссылка заменена) -->
    <div class="fighter-rb" id="fighterRb">
      <img src="https://i.imgur.com/4O5P4Z0.png" 
           onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=can-placeholder>RED BULL</div>';">
    </div>

    <!-- КОНКУРЕНТ -->
    <div class="fighter-enemy" id="fighterEnemy">
      <img id="enemyImg" src="" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=can-placeholder id=enemyNameFallback>ENEMY</div>';">
    </div>

    <!-- ПЛАШКА СРАВНЕНИЯ (Все показатели) -->
    <div class="clash-box" id="clashBox">
      <div class="clash-title" id="clashTitle">СРАВНЕНИЕ</div>
      
      <div class="stat-row"><span class="stat-name">ЭНЕРГИЯ</span><div class="stat-bar-bg"><div class="stat-bar-fill fill-rb" id="rb-energy"></div><div class="stat-bar-fill fill-enemy" id="en-energy"></div></div></div>
      <div class="stat-row"><span class="stat-name">ВКУС</span><div class="stat-bar-bg"><div class="stat-bar-fill fill-rb" id="rb-taste"></div><div class="stat-bar-fill fill-enemy" id="en-taste"></div></div></div>
      <div class="stat-row"><span class="stat-name">БРЕНД</span><div class="stat-bar-bg"><div class="stat-bar-fill fill-rb" id="rb-brand"></div><div class="stat-bar-fill fill-enemy" id="en-brand"></div></div></div>
      <div class="stat-row"><span class="stat-name">ЦЕНА</span><div class="stat-bar-bg"><div class="stat-bar-fill fill-rb" id="rb-price"></div><div class="stat-bar-fill fill-enemy" id="en-price"></div></div></div>
      <div class="stat-row"><span class="stat-name">СПОРТ</span><div class="stat-bar-bg"><div class="stat-bar-fill fill-rb" id="rb-sport"></div><div class="stat-bar-fill fill-enemy" id="en-sport"></div></div></div>
    </div>

    <!-- ПЛАШКА MOGGED -->
    <div class="mogged-slam" id="moggedBadge">MOGGED</div>

    <!-- ФИНАЛ -->
    <div class="final-overlay" id="finalOverlay">
      <div class="achievements-box">
        <div class="achievements-title">★ RED BULL ★</div>
        <div class="ach-item">№1 Энергетический напиток в мире</div>
        <div class="ach-item">12+ млрд банок продано за год</div>
        <div class="ach-item">Присутствует в 175+ странах</div>
        <div class="ach-item">Владеет 2 командами Формулы-1</div>
        <div class="ach-item">Самый узнаваемый бренд на планете</div>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ========== 1. КУРСОР ========== */
  var cursor = document.getElementById('cursorGlow');
  var mx = window.innerWidth / 2, my = window.innerHeight / 2;
  var cx = mx, cy = my;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function loop() {
    cx += (mx - cx) * 0.2; cy += (my - cy) * 0.2;
    cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.querySelectorAll('.btn, .close-btn').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });

  /* ========== 2. ЗВУКИ ========== */
  var audioCtx = null;
  function playSound(type) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      
      if (type === 'slam') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
      } else if (type === 'sweep') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(200, t);
        osc.frequency.linearRampToValueAtTime(800, t + 0.6);
        gain.gain.setValueAtTime(0.05, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.6);
        osc.start(t); osc.stop(t + 0.6);
      } else if (type === 'win') {
        osc.type = 'square'; osc.frequency.setValueAtTime(400, t);
        osc.frequency.setValueAtTime(600, t + 0.1);
        osc.frequency.setValueAtTime(800, t + 0.2);
        osc.frequency.setValueAtTime(1200, t + 0.3);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
        osc.start(t); osc.stop(t + 0.8);
      } else if (type === 'death') {
        /* Звук смерти как в Марио */
        osc.type = 'square'; osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.5);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
        osc.start(t); osc.stop(t + 0.5);
      } else {
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(600, t + 0.1);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.start(t); osc.stop(t + 0.1);
      }
    } catch(e){}
  }

  /* ========== 3. ДАННЫЕ ========== */
  /* Ред Булл имеет 100 по всем показателям. Остальные - реальные условные значения (0-100) */
  var rbStats = { energy: 100, taste: 95, brand: 100, price: 90, sport: 100 };

  var enemies = [
    { 
      name: 'MONSTER',  
      img: 'https://i.imgur.com/cmCzspE.jpeg', 
      stats: { energy: 95, taste: 70, brand: 85, price: 60, sport: 80 } 
    },
    { 
      name: 'BURN',     
      img: 'https://i.imgur.com/fJ708pU.jpeg', 
      stats: { energy: 80, taste: 85, brand: 70, price: 75, sport: 50 } 
    },
    { 
      name: 'GORILLA',  
      img: 'https://i.imgur.com/cErN9nA.jpeg', 
      stats: { energy: 85, taste: 60, brand: 40, price: 95, sport: 40 } 
    },
    { 
      name: 'FLASH',    
      img: 'https://i.imgur.com/2Il4QV1.png',  
      stats: { energy: 75, taste: 65, brand: 50, price: 90, sport: 30 } 
    }
  ];

  /* ========== 4. ЛОГИКА ========== */
  var btnStart = document.getElementById('btnStart');
  var mainWindow = document.getElementById('mainWindow');
  var arenaModal = document.getElementById('arenaModal');
  var btnClose = document.getElementById('btnClose');
  
  var fighterRb = document.getElementById('fighterRb');
  var fighterEnemy = document.getElementById('fighterEnemy');
  var clashBox = document.getElementById('clashBox');
  var clashTitle = document.getElementById('clashTitle');
  var moggedBadge = document.getElementById('moggedBadge');
  var finalOverlay = document.getElementById('finalOverlay');

  var timers = [];
  function sched(fn, delay) { timers.push(setTimeout(fn, delay)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function resetArena() {
    clearTimers();
    fighterRb.classList.remove('center');
    fighterRb.classList.add('show');
    arenaModal.classList.add('show');
    mainWindow.style.opacity = '0';
    
    finalOverlay.classList.remove('show');
    moggedBadge.classList.remove('slam');
    clashBox.classList.remove('show');
    
    runBattle(0);
  }

  function runBattle(index) {
    if (index >= enemies.length) {
      sched(() => {
        fighterRb.classList.add('center');
        playSound('win');
        sched(() => finalOverlay.classList.add('show'), 1000);
      }, 1000);
      return;
    }

    var enemy = enemies[index];

    fighterEnemy.classList.remove('show', 'dead');
    fighterEnemy.innerHTML = '<img id="enemyImg" src="'+enemy.img+'" onerror="this.style.display=\'none\'; this.parentElement.innerHTML=\'<div class=can-placeholder>'+enemy.name+'</div>\';">';
    
    sched(() => {
      fighterEnemy.classList.add('show');
      playSound('pop');
    }, 300);

    sched(() => {
      clashTitle.textContent = "СРАВНЕНИЕ";
      clashBox.classList.add('show');
      
      // Сброс баров
      document.querySelectorAll('.stat-bar-fill').forEach(el => el.style.width = '0%');
      
      // Заполнение баров для RB и врага
      var keys = ['energy', 'taste', 'brand', 'price', 'sport'];
      keys.forEach(key => {
        document.getElementById('rb-' + key).style.width = rbStats[key] + '%';
        document.getElementById('en-' + key).style.width = enemy.stats[key] + '%';
      });
      
      playSound('sweep');
    }, 1000);

    sched(() => {
      moggedBadge.classList.add('slam');
      playSound('slam');
    }, 2500);

    sched(() => {
      fighterEnemy.classList.add('dead');
      playSound('death');
    }, 3200);

    sched(() => {
      clashBox.classList.remove('show');
      moggedBadge.classList.remove('slam');
    }, 4000);

    sched(() => {
      fighterEnemy.classList.remove('dead');
      runBattle(index + 1);
    }, 4800);
  }

  btnStart.addEventListener('click', resetArena);

  btnClose.addEventListener('click', function() {
    clearTimers();
    arenaModal.classList.remove('show');
    mainWindow.style.opacity = '1';
    fighterEnemy.classList.remove('show', 'dead');
    fighterRb.classList.remove('center', 'show');
  });

})();
</script>
</body>
</html>
