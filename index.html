<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Red Bull // Energy Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100vh;
    background-color: #050814; overflow: hidden;
    font-family: 'Courier Prime', monospace;
    position: fixed; top: 0; left: 0;
    cursor: none;
  }

  /* --- КУРСОР --- */
  .cursor-glow {
    position: fixed; top: 0; left: 0;
    width: 20px; height: 20px;
    border: 1px solid #D6001C; border-radius: 50%;
    pointer-events: none; z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width .25s ease, height .25s ease,
                background .25s ease, border-color .25s ease,
                box-shadow .25s ease;
    box-shadow: 0 0 15px #D6001C, inset 0 0 10px #D6001C;
    mix-blend-mode: screen;
    will-change: left, top;
  }
  .cursor-glow.hover {
    width: 44px; height: 44px;
    background: rgba(214, 0, 28, .2);
    border-color: #fff;
    box-shadow: 0 0 25px #D6001C, inset 0 0 18px #D6001C;
  }

  /* --- ФОН --- */
  .bg-energy {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 1;
    background:
      radial-gradient(circle at 50% 50%, rgba(214, 0, 28, 0.15) 0%, transparent 60%),
      linear-gradient(135deg, #050814 0%, #111a33 50%, #050814 100%);
    overflow: hidden;
  }

  #energyCanvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 3; pointer-events: none;
    opacity: 0.8; mix-blend-mode: screen;
  }

  /* --- ГЛАВНОЕ ОКНО --- */
  .main-window {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90%; max-width: 380px;
    background: rgba(5, 8, 20, 0.75);
    border: 1px solid rgba(214, 0, 28, 0.4);
    border-top: 4px solid #D6001C;
    border-radius: 12px; padding: 40px 25px 30px; z-index: 10;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(214, 0, 28, 0.1);
    color: #fff; text-align: center;
    animation: windowBreath 6s ease-in-out infinite;
    transition: opacity .6s ease; will-change: transform;
  }
  @keyframes windowBreath {
    0%, 100% { transform: translate(-50%,-50%) translateY(0) scale(1); }
    50% { transform: translate(-50%,-50%) translateY(-8px) scale(1.01); }
  }

  .main-window h1 {
    margin: 0; font-size: 34px; letter-spacing: 4px; color: #fff;
    text-shadow: 0 0 20px rgba(214, 0, 28, 0.9), 0 0 40px rgba(214, 0, 28, 0.5);
    font-weight: 700; font-family: 'Oswald', sans-serif;
    text-transform: uppercase; font-style: italic;
  }

  .subtitle {
    font-size: 13px; color: #D6001C; margin: 8px 0 35px; letter-spacing: 4px;
    text-transform: uppercase; opacity: 0.9; font-weight: 700;
  }

  .button-group { display: flex; flex-direction: column; gap: 15px; width: 100%; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(214, 0, 28, 0.05); color: #fff;
    border: 1px solid rgba(214, 0, 28, 0.4);
    padding: 16px 20px; font-family: 'Oswald', sans-serif;
    font-size: 16px; font-weight: 700; text-transform: uppercase;
    cursor: none; position: relative; overflow: hidden;
    border-radius: 6px; letter-spacing: 2px;
    transition: all .3s ease;
  }
  .btn:hover, .btn:focus-visible {
    background: rgba(214, 0, 28, 0.2); border-color: #D6001C;
    letter-spacing: 3px; transform: translateY(-2px);
    box-shadow: 0 0 35px rgba(214, 0, 28, 0.6); outline: none;
  }

  .from-me {
    margin-top: 30px;
    font-size: 11px;
    color: rgba(214, 0, 28, 0.8);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Oswald', sans-serif;
    border-top: 1px dashed rgba(214, 0, 28, 0.3);
    padding-top: 15px;
  }

  /* --- МОДАЛКИ --- */
  .modal-box {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 92%; max-width: 400px;
    background: #050814;
    border: 2px solid #D6001C; border-top: 6px solid #D6001C;
    border-radius: 12px; padding: 25px; z-index: 200;
    box-shadow: 0 0 60px rgba(214, 0, 28, 0.4); text-align: left;
    font-family: 'Courier Prime', monospace; max-height: 85vh; overflow-y: auto;
  }
  .modal-box.show { display: block; animation: terminalOpen .4s ease forwards; }
  @keyframes terminalOpen {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.8); }
    100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }

  /* ОКНО СРАВНЕНИЯ */
  .score-modal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 96vw; max-width: 850px; height: 92vh; max-height: 900px;
    background: #050814;
    border: 2px solid #D6001C; border-radius: 16px; padding: 25px 20px;
    z-index: 200; box-shadow: 0 0 100px rgba(214, 0, 28, 0.5);
    text-align: center; font-family: 'Courier Prime', monospace;
    overflow-y: auto; flex-direction: column;
    align-items: center;
  }
  .score-modal.show { display: flex; animation: scoreBigOpen .6s ease forwards; }
  @keyframes scoreBigOpen {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.7); }
    100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }

  .modal-header {
    color: #D6001C; font-size: 22px; border-bottom: 2px dashed rgba(214, 0, 28, 0.4);
    padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between;
    align-items: center; font-weight: bold; font-family: 'Oswald', sans-serif;
    text-transform: uppercase; letter-spacing: 4px; width: 100%;
  }

  /* ТАБЛО */
  .huge-score {
    display: flex; justify-content: center; align-items: center; gap: 30px;
    padding: 15px; background: rgba(214, 0, 28, 0.1);
    border: 2px solid rgba(214, 0, 28, 0.6); border-radius: 16px; margin-bottom: 20px;
    width: 100%; max-width: 600px; font-family: 'Oswald', sans-serif;
  }
  .huge-team { text-align: center; }
  .huge-team-name { font-size: 18px; color: #fff; letter-spacing: 3px; margin-bottom: 5px; font-weight: 700; }
  .huge-team-score { font-size: 60px; font-weight: 700; color: #fff; text-shadow: 0 0 30px #D6001C; line-height: 1; transition: color 0.3s; }
  .huge-team.winner .huge-team-score { color: #D6001C; text-shadow: 0 0 40px #D6001C, 0 0 80px rgba(214, 0, 28, 0.6); font-size: 80px; }
  .huge-team.winner .huge-team-name { color: #D6001C; }
  .huge-sep { font-size: 50px; color: #D6001C; opacity: .5; font-weight: 700; }

  .huge-winner-label {
    text-align: center; color: #D6001C; font-family: 'Oswald', sans-serif;
    font-size: 20px; letter-spacing: 6px; text-transform: uppercase;
    margin-bottom: 25px; font-weight: 700; font-style: italic;
    animation: blinkGold 1s infinite alternate;
  }
  @keyframes blinkGold { 0% { opacity: 1; text-shadow: 0 0 20px #D6001C; } 100% { opacity: .7; text-shadow: 0 0 50px #D6001C; } }

  /* ВЕРТИКАЛЬНЫЕ ШКАЛЫ */
  .dynamics-container {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    width: 100%;
    max-width: 750px;
    height: 350px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(214, 0, 28, 0.2);
    border-radius: 12px;
    padding: 30px 10px 10px;
    margin-bottom: 20px;
    gap: 10px;
    position: relative;
  }

  .bar-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    flex: 1;
    position: relative;
  }

  .bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 100%;
    width: 100%;
    justify-content: center;
  }

  .bar {
    width: 20px;
    border-radius: 4px 4px 0 0;
    position: relative;
    transition: height 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex; justify-content: center;
  }

  .bar-rb {
    background: linear-gradient(to top, #8b0010, #D6001C, #ff4d6d);
    box-shadow: 0 0 15px rgba(214, 0, 28, 0.6);
    height: 100%; /* Red Bull всегда на максимуме */
    z-index: 2;
  }

  .bar-other {
    background: linear-gradient(to top, #222, #444);
    border: 1px solid #555;
    height: 0%;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s ease;
  }

  .bar-group.active .bar-other {
    opacity: 1;
    transform: translateY(0);
  }

  .bar-label {
    margin-top: 10px;
    color: #ccc;
    font-size: 10px;
    text-transform: uppercase;
    text-align: center;
    height: 30px;
    line-height: 1.2;
    font-family: 'Oswald', sans-serif;
    opacity: 0.5;
    transition: opacity 0.3s;
  }

  .bar-group.active .bar-label {
    opacity: 1;
    color: #fff;
    font-weight: 700;
  }

  .bar-val {
    position: absolute;
    top: -20px;
    font-size: 10px;
    font-weight: bold;
    color: #fff;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .bar-rb .bar-val { color: #D6001C; opacity: 1; }
  .bar-other .bar-val { color: #666; }
  .bar-group.active .bar-other .bar-val { opacity: 1; }

  /* MOGGED ПЛАШКА */
  .mogged-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0) rotate(-15deg);
    background: #D6001C;
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 900;
    padding: 8px 15px;
    border: 2px solid #fff;
    border-radius: 4px;
    letter-spacing: 2px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.8), 0 0 20px #D6001C;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .bar-group.active .mogged-overlay {
    animation: moggedPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes moggedPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(-30deg); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(-10deg); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-15deg); }
  }

  .close-btn {
    background: transparent; color: #D6001C; border: 1px solid #D6001C; padding: 8px 16px;
    font-family: 'Oswald', sans-serif; font-size: 16px; cursor: pointer;
    transition: .2s; text-transform: uppercase; border-radius: 4px;
  }
  .close-btn:hover { background: #D6001C; color: #fff; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.9); z-index: 150;
  }
  .modal-overlay.show { display: block; }

  /* ФОТО БРО */
  .friend-photo {
    width: 100%; border-radius: 8px; border: 2px solid #D6001C;
    box-shadow: 0 0 30px rgba(214, 0, 28, 0.4);
    display: block; margin-bottom: 15px; object-fit: cover; max-height: 350px;
    background: #111;
  }
  .friend-caption {
    text-align: center; color: #fff; font-size: 14px; line-height: 1.7;
    font-family: 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase;
    padding: 15px; background: rgba(214, 0, 28, 0.1);
    border-radius: 6px; border-left: 4px solid #D6001C;
  }
  .friend-caption .highlight { color: #D6001C; text-shadow: 0 0 10px rgba(214, 0, 28, 0.6); }

  .status-bar {
    margin-top: auto; border-top: 1px dashed rgba(214, 0, 28, 0.3); padding-top: 15px;
    font-size: 11px; color: #D6001C; display: flex; justify-content: space-between;
    letter-spacing: 1px; width: 100%;
  }

  @media (max-width: 700px) {
    .huge-team-score { font-size: 40px; }
    .huge-team.winner .huge-team-score { font-size: 60px; }
    .huge-sep { font-size: 30px; }
    .huge-score { gap: 10px; padding: 10px; }
    
    .dynamics-container { height: 250px; padding: 20px 5px 5px; gap: 4px; }
    .bar { width: 12px; }
    .bar-label { font-size: 8px; height: 24px; }
    .mogged-overlay { font-size: 12px; padding: 4px 8px; border-width: 1px; }
  }
</style>
</head>
<body>

  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="bg-energy"></div>
  <canvas id="energyCanvas"></canvas>

  <div class="main-window" id="mainWindow">
    <h1>ЛУЧШИЙ ЭНЕРГЕТИК</h1>
    <p class="subtitle">RED BULL ARENA</p>

    <div class="button-group">
      <button id="btnFriend" class="btn" type="button">
        <span>ФОТО МОЕГО БРО</span>
      </button>
      <button id="btnScore" class="btn" type="button" style="width:100%;">
        <span>БИТВА ЭНЕРГЕТИКОВ</span>
      </button>
    </div>

    <div class="from-me">Сделано с душой для Ташки ❤️</div>
  </div>

  <div class="modal-overlay" id="modalOverlay"></div>

  <!-- ОКНО БИТВЫ -->
  <div class="score-modal" id="scoreModal">
    <div class="modal-header">
      <span>ПОЛНАЯ ПОБЕДА</span>
      <button class="close-btn" id="btnCloseScore" type="button">[ X ]</button>
    </div>

    <div class="huge-score">
      <div class="huge-team winner">
        <div class="huge-team-name">RED BULL</div>
        <div class="huge-team-score" id="scoreRb">0</div>
      </div>
      <div class="huge-sep">:</div>
      <div class="huge-team">
        <div class="huge-team-name">КОНКУРЕНТЫ</div>
        <div class="huge-team-score">0</div>
      </div>
    </div>

    <div class="huge-winner-label">★ РАЗГРОМ ★</div>

    <!-- ДИНАМИКА -->
    <div class="dynamics-container" id="dynamicsContainer">
      <!-- Столбцы будут добавлены через JS -->
    </div>

    <div class="status-bar">
      <span>РЕЖИМ: ТУРБО</span>
      <span>БАНКА: ОТКРЫТА</span>
    </div>
  </div>

  <!-- МОДАЛКА ФОТО БРО -->
  <div class="modal-box" id="friendModal">
    <div class="modal-header">
      <span>МОЙ БРО</span>
      <button class="close-btn" id="btnCloseFriend" type="button">[ X ]</button>
    </div>
    <div style="position: relative; width: 100%;">
      <img class="friend-photo" id="friendPhoto" src="" alt="Энергетик">
      
      <div class="friend-caption">
        Мой бро, с которым общаюсь больше года,<br>
        но так и не увиделся — слава богу.<br>
        <span class="highlight">И да, он смотрит мои ТикТоки 😎</span>
      </div>
    </div>
    <div class="status-bar">
      <span>ОНЛАЙН: ДА</span>
      <span>ДРУЖБА: 1+ ГОД</span>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ========== КУРСОР ========== */
  var cursor = document.getElementById('cursorGlow');
  var mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  var curX = mouseX, curY = mouseY;

  document.addEventListener('mousemove', function (e) {
    mouseX = e.clientX; mouseY = e.clientY;
  });
  document.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    if (t) { mouseX = t.clientX; mouseY = t.clientY; }
  }, { passive: true });

  function cursorLoop() {
    curX += (mouseX - curX) * 0.25;
    curY += (mouseY - curY) * 0.25;
    cursor.style.left = curX + 'px';
    cursor.style.top  = curY + 'px';
    requestAnimationFrame(cursorLoop);
  }
  requestAnimationFrame(cursorLoop);

  function bindCursorHover(el) {
    if (!el) return;
    el.addEventListener('mouseenter', function () { cursor.classList.add('hover'); });
    el.addEventListener('mouseleave', function () { cursor.classList.remove('hover'); });
  }
  document.querySelectorAll('.btn, .close-btn').forEach(bindCursorHover);

  /* ========== ЛЕТАЮЩИЕ БАНКИ ========== */
  var canvas = document.getElementById('energyCanvas');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  var particles = [];
  var MAX_PARTICLES = 25;
  var brands = ['⚡', '🐂', '🔥', '⚡'];

  function createParticle() {
    var isCan = Math.random() < 0.6;
    var angle = Math.random() * Math.PI * 2;
    var speed = 0.5 + Math.random() * 2;
    return {
      type: isCan ? 'can' : 'emoji',
      x: Math.random() * W,
      y: Math.random() * H,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: isCan ? (12 + Math.random() * 15) : (20 + Math.random() * 15),
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.05,
      alpha: 0.3 + Math.random() * 0.5,
      emoji: brands[Math.floor(Math.random() * brands.length)]
    };
  }

  for (var i = 0; i < MAX_PARTICLES; i++) particles.push(createParticle());

  function drawParticles() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed;

      if (p.x < -80) p.x = W + 80;
      if (p.x > W + 80) p.x = -80;
      if (p.y < -80) p.y = H + 80;
      if (p.y > H + 80) p.y = -80;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;

      if (p.type === 'can') {
        ctx.beginPath();
        ctx.roundRect(-p.size/2, -p.size*1.5, p.size, p.size*3, 4);
        ctx.fillStyle = '#D6001C'; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath(); ctx.rect(-p.size/2, -p.size*1.5, p.size, 4); ctx.fillStyle = '#ccc'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-p.size/2, -p.size*0.2); ctx.lineTo(p.size/2, -p.size*0.2); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.stroke();
      } else {
        ctx.font = p.size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = '#D6001C'; ctx.shadowBlur = 15;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fillText(p.emoji, 0, 0);
      }
      ctx.restore();
    }
    requestAnimationFrame(drawParticles);
  }
  requestAnimationFrame(drawParticles);

  /* ========== ЗВУК ========== */
  var audioCtx = null;
  function playCanSound() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.2);
      gain.gain.setValueAtTime(0.001, t); gain.gain.exponentialRampToValueAtTime(0.2, t + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.3);
    } catch (e) { console.warn('Audio blocked'); }
  }

  /* ========== ГЕНЕРАЦИЯ ГРАФИКОВ И MOGGED ========== */
  var dynContainer = document.getElementById('dynamicsContainer');
  var scoreRbEl = document.getElementById('scoreRb');
  
  // Данные (названия конкурентов добавлены в подписи)
  var chartData = [
    { name: 'ЭНЕРГИЯ', rb: 100, other: 30, opp: 'MONSTER' },
    { name: 'ВКУС', rb: 100, other: 45, opp: 'FLASH' },
    { name: 'ПРОДАЖИ', rb: 100, other: 25, opp: 'ADRENALINE' },
    { name: 'ДИЗАЙН', rb: 100, other: 20, opp: 'BURN' },
    { name: 'СПОНСОРЫ', rb: 100, other: 10, opp: 'ROCKSTAR' },
    { name: 'БРЕНД', rb: 100, other: 35, opp: 'REIGN' }
  ];

  var animTimeouts = [];

  function buildCharts() {
    dynContainer.innerHTML = ''; 
    scoreRbEl.textContent = '0';
    
    chartData.forEach(function(item) {
      var group = document.createElement('div');
      group.className = 'bar-group';
      
      var barsDiv = document.createElement('div');
      barsDiv.className = 'bars';
      
      // Столбец Red Bull
      var barRb = document.createElement('div');
      barRb.className = 'bar bar-rb';
      barRb.innerHTML = '<span class="bar-val">' + item.rb + '</span>';
      
      // Столбец Конкурента
      var barOther = document.createElement('div');
      barOther.className = 'bar bar-other';
      barOther.style.height = item.other + '%'; // Задаем высоту
      barOther.innerHTML = '<span class="bar-val">' + item.other + '</span>';
      
      barsDiv.appendChild(barRb);
      barsDiv.appendChild(barOther);
      
      // Плашка MOGGED
      var mogged = document.createElement('div');
      mogged.className = 'mogged-overlay';
      mogged.textContent = 'MOGGED';

      // Подпись (Параметр + Конкурент)
      var label = document.createElement('div');
      label.className = 'bar-label';
      label.innerHTML = item.name + '<br><span style="color:#D6001C; font-size:8px;">' + item.opp + '</span>';
      
      group.appendChild(barsDiv);
      group.appendChild(mogged);
      group.appendChild(label);
      dynContainer.appendChild(group);
    });
  }
  
  buildCharts();

  function animateCharts() {
    // Очищаем старые таймеры, если есть
    animTimeouts.forEach(clearTimeout);
    animTimeouts = [];
    
    // Сброс классов
    var groups = dynContainer.querySelectorAll('.bar-group');
    groups.forEach(function(g) { g.classList.remove('active'); });
    scoreRbEl.textContent = '0';
    
    // Поочередное появление
    groups.forEach(function(group, index) {
      var t = setTimeout(function() {
        // 1. Активируем группу (вылетает серый столбец и плашка MOGGED)
        group.classList.add('active');
        
        // 2. Звук "удара"
        playCanSound();
        
        // 3. Увеличиваем счет Red Bull
        scoreRbEl.textContent = (index + 1) * 10;
        
        // 4. Небольшая тряска всей группы
        group.style.animation = 'shakeGroup 0.3s';
        setTimeout(function() { group.style.animation = ''; }, 300);

      }, index * 600); // Задержка 600мс между конкурентами
      
      animTimeouts.push(t);
    });
  }

  // Добавляем CSS анимацию для тряски
  var style = document.createElement('style');
  style.innerHTML = '@keyframes shakeGroup { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }';
  document.head.appendChild(style);

  /* ========== УПРАВЛЕНИЕ ========== */
  var modalOverlay = document.getElementById('modalOverlay');
  var friendModal = document.getElementById('friendModal');
  var friendPhoto = document.getElementById('friendPhoto');
  var scoreModal = document.getElementById('scoreModal');

  var FRIEND_PHOTO_URL = 'https://i.ibb.co/NdMS67JK/ebcd82b6-535a-11ef-a64b-36ac77b49419-9002490217846.jpg';

  function closeAll() {
    friendModal.classList.remove('show');
    scoreModal.classList.remove('show');
    modalOverlay.classList.remove('show');
    animTimeouts.forEach(clearTimeout); // Останавливаем анимацию при закрытии
  }

  document.getElementById('btnFriend').addEventListener('click', function () {
    playCanSound();
    friendPhoto.src = FRIEND_PHOTO_URL;
    friendModal.classList.add('show');
    modalOverlay.classList.add('show');
  });

  document.getElementById('btnCloseFriend').addEventListener('click', closeAll);

  document.getElementById('btnScore').addEventListener('click', function () {
    scoreModal.classList.add('show');
    modalOverlay.classList.add('show');
    
    // Запускаем битву
    setTimeout(animateCharts, 300);
  });
  
  document.getElementById('btnCloseScore').addEventListener('click', closeAll);
  modalOverlay.addEventListener('click', closeAll);

})();
</script>
</body>
</html>
