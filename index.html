<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Red Bull Supremacy</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100vh;
    background: #05070a; overflow: hidden;
    font-family: 'Courier Prime', monospace;
    position: fixed; top: 0; left: 0; cursor: none;
  }
  
  /* КУРСОР */
  .cursor-glow {
    position: fixed; top: 0; left: 0; width: 20px; height: 20px;
    border: 1px solid #ffd700; border-radius: 50%;
    pointer-events: none; z-index: 99999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px #ffd700, inset 0 0 10px #ffd700;
    mix-blend-mode: screen; transition: width 0.2s, height 0.2s, background 0.2s;
  }
  .cursor-glow.hover { width: 44px; height: 44px; background: rgba(255,215,0,.15); }

  .bg-main {
    position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(circle at 30% 20%, rgba(255,215,0,.05) 0%, transparent 40%),
                linear-gradient(180deg, #05070a 0%, #0a101a 50%, #05070a 100%);
  }
  
  /* ГЛАВНОЕ ОКНО */
  .main-window {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 90%; max-width: 380px; background: rgba(10, 15, 25, 0.8);
    border: 1px solid rgba(255, 215, 0, 0.2); border-top: 3px solid #ffd700;
    border-radius: 12px; padding: 40px 25px 30px; z-index: 10;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); color: #fff; text-align: center;
    animation: windowBreath 7s ease-in-out infinite; transition: opacity .6s ease;
  }
  @keyframes windowBreath {
    0%, 100% { transform: translate(-50%,-50%) translateY(0); }
    50% { transform: translate(-50%,-50%) translateY(-6px); }
  }
  .main-window h1 { margin: 0; font-size: 26px; letter-spacing: 3px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.9); font-family: 'Oswald', sans-serif; line-height: 1.2; }
  .subtitle-ru { font-size: 12px; color: #ffd700; margin: 15px 0 35px; opacity: .8; }
  
  .btn {
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,215,0,.05); color: #fff; border: 1px solid rgba(255,215,0,.3);
    padding: 16px 20px; font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700;
    text-transform: uppercase; cursor: none; border-radius: 6px; letter-spacing: 2px;
    transition: all .4s; width: 100%;
  }
  .btn:hover { background: rgba(255,215,0,.15); border-color: #ffd700; }

  /* АРЕНА */
  .arena-modal {
    display: none; position: fixed; inset: 0;
    background: radial-gradient(circle at center, #111822 0%, #030508 100%);
    z-index: 200; overflow: hidden; opacity: 0; transition: opacity 0.6s;
  }
  .arena-modal.show { display: block; opacity: 1; }
  
  .scanline {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.5) 51%);
    background-size: 100% 4px; opacity: 0.15;
  }

  /* БАНКИ - СДЕЛАНЫ ОГРОМНЫМИ */
  .fighter-rb, .fighter-enemy {
    position: absolute; top: 45%; transform: translateY(-50%);
    z-index: 20; width: 220px; height: 450px; /* Огромный размер */
    display: flex; align-items: center; justify-content: center;
    transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    background: #1a1f2b;
    border-radius: 16px; padding: 15px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.7);
  }
  
  .fighter-rb { 
    left: 2%; opacity: 0; 
    border: 3px solid #ffd700; 
    box-shadow: 0 0 35px rgba(255,215,0,0.4);
  }
  .fighter-rb.show { opacity: 1; }
  
  .fighter-enemy { 
    right: 2%; opacity: 0; transform: translate(200px, -50%); /* Выезжает справа */
  }
  .fighter-enemy.show { opacity: 1; transform: translate(0, -50%); }
  
  /* Цветные рамки конкурентов */
  .border-monster { border: 3px solid #00ff00; box-shadow: 0 0 35px rgba(0,255,0,0.4); }
  .border-burn    { border: 3px solid #ff4500; box-shadow: 0 0 35px rgba(255,69,0,0.4); }
  .border-gorilla { border: 3px solid #ffffff; box-shadow: 0 0 35px rgba(255,255,255,0.4); }
  .border-flash   { border: 3px solid #00bfff; box-shadow: 0 0 35px rgba(0,191,255,0.4); }

  .fighter-rb img, .fighter-enemy img { 
    width: 100%; height: 100%; object-fit: contain; 
    border-radius: 10px; 
  }

  .enemy-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  
  .mogged-on-enemy {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0) rotate(-15deg);
    background: #ff1a1a; color: #fff; border: 4px solid #fff; padding: 8px 20px;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 24px;
    box-shadow: 0 0 40px #ff1a1a, 0 0 80px rgba(255,26,26,0.6); z-index: 99; text-shadow: 2px 2px 0 #000;
    opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
  }
  .mogged-on-enemy.slam { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-10deg); }

  /* ДИАГРАММА */
  .clash-box {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%) scale(0.8);
    width: 90%; max-width: 340px; background: rgba(10,15,25,0.95);
    border: 2px solid #ffd700; border-radius: 12px; padding: 15px;
    z-index: 15; opacity: 0; transition: all 0.4s ease;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
  }
  .clash-box.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  
  .clash-title { font-family: 'Oswald', sans-serif; color: #ffd700; font-size: 16px; letter-spacing: 2px; text-align: center; margin-bottom: 10px; }

  .chart-container { display: flex; justify-content: space-around; align-items: flex-end; height: 100px; margin-bottom: 5px; }
  .chart-col { display: flex; flex-direction: column; align-items: center; width: 40px; }
  .bar-group { display: flex; align-items: flex-end; gap: 4px; height: 80px; }
  .bar-vertical { width: 14px; height: 100%; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; overflow: hidden; }
  .bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; transition: height 0.8s ease; }
  .bar-fill.rb { background: #ffd700; box-shadow: 0 0 10px #ffd700; }
  .bar-fill.en { background: #888; }
  .bar-label { font-family: 'Oswald'; font-size: 9px; color: #aaa; margin-top: 4px; }

  .scores-row { display: flex; justify-content: space-around; margin-top: 5px; }
  .score-pair { display: flex; flex-direction: column; align-items: center; width: 40px; font-size: 11px; font-family: 'Oswald'; }
  .score-rb { color: #ffd700; font-weight: bold; }
  .score-en { color: #888; }

  /* СМЕРТЬ КАК В МАРИО */
  .fighter-enemy.dead { animation: marioDeath 1.2s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94); }
  @keyframes marioDeath {
    0% { transform: translate(0, -50%) scale(1); opacity: 1; }
    30% { transform: translate(0, -150%) scale(1); opacity: 1; }
    50% { transform: translate(50px, -50%) scale(0.9) rotate(180deg); opacity: 1; }
    100% { transform: translate(200px, 150%) scale(0.3) rotate(360deg); opacity: 0; }
  }

  /* ФИНАЛ */
  .final-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100;
    display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 1s;
  }
  .final-overlay.show { opacity: 1; pointer-events: auto; }
  .achievements-box { background: #111; border: 3px solid #ffd700; border-radius: 20px; padding: 30px; text-align: center; transform: scale(0.8); transition: all 0.8s ease; }
  .final-overlay.show .achievements-box { transform: scale(1); }
  .achievements-title { font-family: 'Oswald'; font-size: 28px; color: #ffd700; margin-bottom: 20px; }
  .ach-item { font-size: 14px; color: #fff; display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,215,0,0.2); text-align: left; }
  .ach-item::before { content: '🏆'; }

  .close-btn {
    position: absolute; top: 15px; right: 15px; z-index: 999;
    background: transparent; color: #ffd700; border: 1px solid #ffd700;
    padding: 8px 15px; cursor: pointer; border-radius: 4px; font-family: 'Oswald';
  }
  .close-btn:hover { background: #ffd700; color: #000; }

  @media (max-width: 800px) {
    .fighter-rb, .fighter-enemy { width: 140px; height: 300px; top: 40%; padding: 8px; }
    .clash-box { top: 40%; width: 95%; max-width: 300px; }
  }
</style>
</head>
<body>

<div class="cursor-glow" id="cursorGlow"></div>
<div class="bg-main"></div>

<div class="main-window" id="mainWindow">
  <h1>ВЫ ДОЛЖНЫ<br>ЭТО ЗНАТЬ</h1>
  <p class="subtitle-ru">Сделано: zero.ping</p>
  <button id="btnStart" class="btn" type="button">ЗАПУСТИТЬ</button>
</div>

<div class="arena-modal" id="arenaModal">
  <button class="close-btn" id="btnClose">[ X ] ЗАКРЫТЬ</button>
  <div class="scanline"></div>

  <!-- RED BULL -->
  <div class="fighter-rb" id="fighterRb">
    <img src="https://i.postimg.cc/wjm9tBXm/75e8e792-84a0-46fb-83bb-636e2ab4af05.jpg" 
         onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'color:#ffd700;font-size:20px;font-family:Oswald;\'>RED BULL</div>';">
  </div>

  <!-- КОНКУРЕНТ -->
  <div class="fighter-enemy" id="fighterEnemy">
    <div class="enemy-wrap">
      <img id="enemyImg" src="" 
           onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'color:#fff;font-size:18px;font-family:Oswald;\'>ENEMY</div>';">
      <div class="mogged-on-enemy" id="moggedBadge">MOGGED</div>
    </div>
  </div>

  <!-- ДИАГРАММА -->
  <div class="clash-box" id="clashBox">
    <div class="clash-title">СРАВНЕНИЕ</div>
    <div class="chart-container" id="chartContainer"></div>
    <div class="scores-row" id="scoresRow"></div>
  </div>

  <!-- ФИНАЛ -->
  <div class="final-overlay" id="finalOverlay">
    <div class="achievements-box">
      <div class="achievements-title">★ RED BULL ★</div>
      <div class="ach-item">№1 Энергетический напиток в мире</div>
      <div class="ach-item">12+ млрд банок продано за год</div>
      <div class="ach-item">Присутствует в 175+ странах</div>
      <div class="ach-item">Владеет 2 командами Формулы-1</div>
      <div class="ach-item">Самый узнаваемый бренд на планете</div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cursor = document.getElementById('cursorGlow');
  var mx = window.innerWidth / 2, my = window.innerHeight / 2;
  var cx = mx, cy = my;
  document.addEventListener('mousemove', function(e) { mx = e.clientX; my = e.clientY; });
  function loop() {
    cx += (mx - cx) * 0.2; cy += (my - cy) * 0.2;
    cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  var audioCtx = null;
  function playSound(type) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'slam') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.2);
        gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
      } else if (type === 'sweep') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(200, t);
        osc.frequency.linearRampToValueAtTime(800, t + 0.6);
        gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.6);
        osc.start(t); osc.stop(t + 0.6);
      } else if (type === 'death') {
        osc.type = 'square'; osc.frequency.setValueAtTime(600, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.6);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
        osc.start(t); osc.stop(t + 0.6);
      }
    } catch(e){}
  }

  var rbStats = { energy: 10, taste: 9, brand: 10, price: 8, sport: 10 };
  var statNames = ['energy', 'taste', 'brand', 'price', 'sport'];
  var statLabels = { energy: 'ЭНЕР', taste: 'ВКУС', brand: 'БРЕНД', price: 'ЦЕНА', sport: 'СПОРТ' };
  
  var enemies = [
    { name: 'MONSTER', img: 'https://i.postimg.cc/mgBGrSgt/5206523158133939587.jpg', border: 'border-monster', stats: { energy: 9, taste: 6, brand: 8, price: 5, sport: 7 } },
    { name: 'BURN',    img: 'https://i.postimg.cc/VsWr6KYR/5206523158133939590.jpg', border: 'border-burn',    stats: { energy: 8, taste: 8, brand: 6, price: 7, sport: 4 } },
    { name: 'GORILLA', img: 'https://i.postimg.cc/hPnLZJjR/5206523158133939588.jpg', border: 'border-gorilla', stats: { energy: 8, taste: 5, brand: 3, price: 10, sport: 3 } },
    { name: 'FLASH',   img: 'https://i.postimg.cc/3r4fQDYw/5206523158133939589.jpg', border: 'border-flash',   stats: { energy: 7, taste: 6, brand: 4, price: 9, sport: 2 } }
  ];

  var btnStart = document.getElementById('btnStart');
  var mainWindow = document.getElementById('mainWindow');
  var arenaModal = document.getElementById('arenaModal');
  var btnClose = document.getElementById('btnClose');
  var fighterRb = document.getElementById('fighterRb');
  var fighterEnemy = document.getElementById('fighterEnemy');
  var clashBox = document.getElementById('clashBox');
  var moggedBadge = document.getElementById('moggedBadge');
  var finalOverlay = document.getElementById('finalOverlay');
  var chartContainer = document.getElementById('chartContainer');
  var scoresRow = document.getElementById('scoresRow');

  var timers = [];
  function sched(fn, delay) { timers.push(setTimeout(fn, delay)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function buildChart() {
    chartContainer.innerHTML = '';
    scoresRow.innerHTML = '';
    statNames.forEach(function(key) {
      var col = document.createElement('div');
      col.className = 'chart-col';
      var group = document.createElement('div');
      group.className = 'bar-group';
      
      var barRb = document.createElement('div');
      barRb.className = 'bar-vertical';
      var fillRb = document.createElement('div');
      fillRb.className = 'bar-fill rb';
      fillRb.id = 'bar-rb-' + key;
      barRb.appendChild(fillRb);
      
      var barEn = document.createElement('div');
      barEn.className = 'bar-vertical';
      var fillEn = document.createElement('div');
      fillEn.className = 'bar-fill en';
      fillEn.id = 'bar-en-' + key;
      barEn.appendChild(fillEn);
      
      group.appendChild(barRb); group.appendChild(barEn);
      
      var label = document.createElement('div');
      label.className = 'bar-label';
      label.textContent = statLabels[key];
      
      col.appendChild(group); col.appendChild(label);
      chartContainer.appendChild(col);
      
      var scoreCol = document.createElement('div');
      scoreCol.className = 'score-pair';
      
      var sRb = document.createElement('div');
      sRb.className = 'score-rb';
      sRb.id = 'score-rb-' + key;
      sRb.textContent = rbStats[key];
      
      var sEn = document.createElement('div');
      sEn.className = 'score-en';
      sEn.id = 'score-en-' + key;
      sEn.textContent = '0';
      
      scoreCol.appendChild(sRb); scoreCol.appendChild(sEn);
      scoresRow.appendChild(scoreCol);
    });
  }
  buildChart();

  function resetArena() {
    clearTimers();
    fighterRb.classList.add('show');
    arenaModal.classList.add('show');
    mainWindow.style.opacity = '0';
    finalOverlay.classList.remove('show');
    moggedBadge.classList.remove('slam');
    clashBox.classList.remove('show');
    runBattle(0);
  }

  function runBattle(index) {
    if (index >= enemies.length) {
      sched(function() {
        playSound('win');
        sched(function() { finalOverlay.classList.add('show'); }, 1000);
      }, 1000);
      return;
    }

    var enemy = enemies[index];
    fighterEnemy.classList.remove('show', 'dead');
    fighterEnemy.classList.remove('border-monster', 'border-burn', 'border-gorilla', 'border-flash');
    moggedBadge.classList.remove('slam');
    
    // Ставим новую рамку и картинку
    fighterEnemy.classList.add(enemy.border);
    var imgEl = document.getElementById('enemyImg');
    imgEl.src = enemy.img;
    imgEl.style.display = 'block';

    // ВЫЕЗД КОНКУРЕНТА
    sched(function() {
      fighterEnemy.classList.add('show');
    }, 300);

    // ПОКАЗ ДИАГРАММЫ
    sched(function() {
      clashBox.classList.add('show');
      statNames.forEach(function(key) {
        var fillRb = document.getElementById('bar-rb-' + key);
        var fillEn = document.getElementById('bar-en-' + key);
        var scoreEn = document.getElementById('score-en-' + key);
        
        fillRb.style.height = '0%';
        fillEn.style.height = '0%';
        scoreEn.textContent = '0';
        
        setTimeout(function() {
          fillRb.style.height = (rbStats[key] * 10) + '%';
          fillEn.style.height = (enemy.stats[key] * 10) + '%';
          scoreEn.textContent = enemy.stats[key];
        }, 100);
      });
      playSound('sweep');
    }, 1000);

    // MOGGED
    sched(function() {
      moggedBadge.classList.add('slam');
      playSound('slam');
    }, 2500);

    // СМЕРТЬ
    sched(function() {
      fighterEnemy.classList.add('dead');
      playSound('death');
    }, 3200);

    // СКРЫТИЕ ДИАГРАММЫ
    sched(function() {
      clashBox.classList.remove('show');
      moggedBadge.classList.remove('slam');
    }, 4200);

    // СЛЕДУЮЩИЙ БОЙ
    sched(function() {
      fighterEnemy.classList.remove('dead');
      runBattle(index + 1);
    }, 5000);
  }

  btnStart.addEventListener('click', resetArena);
  btnClose.addEventListener('click', function() {
    clearTimers();
    arenaModal.classList.remove('show');
    mainWindow.style.opacity = '1';
    fighterEnemy.classList.remove('show', 'dead', 'border-monster', 'border-burn', 'border-gorilla', 'border-flash');
    fighterRb.classList.remove('show');
  });
})();
</script>
</body>
</html>
